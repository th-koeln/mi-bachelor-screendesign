<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" font-family="Helvetica, Arial, sans-serif">
<defs>
<clipPath id="c1"><rect x="60" y="60" width="320" height="320"/></clipPath>
<clipPath id="c2"><rect x="440" y="60" width="320" height="320"/></clipPath>
<clipPath id="c3"><rect x="820" y="60" width="320" height="320"/></clipPath>
</defs>
<rect width="1200" height="520" fill="#f2f2f2"/>

<!-- Farbe-an-sich-Kontrast: Gelb und Blau, große angeschnittene Kreisform -->
<g clip-path="url(#c1)">
<rect x="60" y="60" width="320" height="320" fill="#ffd400"/>
<circle cx="300" cy="300" r="170" fill="#1d3fd1"/>
<rect x="100" y="100" width="70" height="70" fill="#1d3fd1"/>
<line x1="60" y1="215" x2="230" y2="215" stroke="#1d3fd1" stroke-width="6"/>
</g>
<text x="60" y="420" font-size="18" font-weight="bold" fill="#333">Farbe-an-sich-Kontrast</text>
<text x="60" y="446" font-size="14" fill="#666">Gelb und Blau, beide rein und kräftig.</text>
<text x="60" y="466" font-size="14" fill="#666">Große Formen, ähnliche Flächenanteile.</text>

<!-- Komplementärkontrast: Blau und Orange, kleine Formen auf großer Fläche -->
<g clip-path="url(#c2)">
<rect x="440" y="60" width="320" height="320" fill="#1f4aa8"/>
<rect x="560" y="180" width="80" height="80" fill="#f58220" transform="rotate(45 600 220)"/>
<rect x="676" y="120" width="28" height="28" fill="#f58220" transform="rotate(45 690 134)"/>
<rect x="508" y="304" width="20" height="20" fill="#f58220" transform="rotate(45 518 314)"/>
</g>
<text x="440" y="420" font-size="18" font-weight="bold" fill="#333">Komplementärkontrast</text>
<text x="440" y="446" font-size="14" fill="#666">Blau und Orange liegen sich gegenüber.</text>
<text x="440" y="466" font-size="14" fill="#666">Wenig Orange auf viel Blau leuchtet stark.</text>

<!-- Qualitätskontrast: leuchtendes Magenta gegen getrübtes Altrosa -->
<g clip-path="url(#c3)">
<rect x="820" y="60" width="320" height="320" fill="#9c8590"/>
<polygon points="820,380 990,380 820,150" fill="#e6007e"/>
<rect x="1000" y="60" width="18" height="320" fill="#e6007e"/>
<rect x="1036" y="60" width="18" height="320" fill="#e6007e"/>
<rect x="1072" y="60" width="18" height="320" fill="#e6007e"/>
</g>
<text x="820" y="420" font-size="18" font-weight="bold" fill="#333">Qualitätskontrast</text>
<text x="820" y="446" font-size="14" fill="#666">Leuchtendes Magenta gegen ein getrübtes,</text>
<text x="820" y="466" font-size="14" fill="#666">gegrautes Rosa desselben Farbtons.</text>

<text x="60" y="36" font-size="16" fill="#666">Beispiele: jede Arbeitsfläche 500 × 500 px, eine Farbe als Grund, die zweite für die Formen</text>
</svg>
